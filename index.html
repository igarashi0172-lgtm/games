<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#1a1a2e">
    <meta name="description" content="オフラインで楽しめるミニゲームコレクション">
    <title>Mini Game Collection</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="app">
        <header id="header">
            <button id="back-btn" class="header-btn hidden" aria-label="戻る">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
            </button>
            <h1 id="header-title">🎮 Mini Games</h1>
            <button id="menu-btn" class="header-btn" aria-label="メニュー">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="1"/><circle cx="12" cy="5" r="1"/><circle cx="12" cy="19" r="1"/></svg>
            </button>
        </header>

        <main id="main-content">
            <section id="home-screen">
                <div class="search-bar">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
                    <input type="text" id="search-input" placeholder="ゲームを検索...">
                </div>
                <div class="category-tabs" id="category-tabs"></div>
                <div class="games-grid" id="games-grid"></div>
            </section>

            <section id="game-screen" class="hidden">
                <div id="game-info">
                    <h2 id="game-title"></h2>
                    <p id="game-desc"></p>
                </div>
                <div id="game-container">
                    <canvas id="game-canvas"></canvas>
                </div>
                <div id="game-ui">
                    <div id="game-score">スコア: <span id="score-value">0</span></div>
                    <div id="game-controls"></div>
                </div>
                <div id="game-overlay" class="hidden">
                    <div id="overlay-content">
                        <h2 id="overlay-title"></h2>
                        <p id="overlay-message"></p>
                        <div id="overlay-buttons"></div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script src="js/app.js"></script>
    <script src="js/game-engine.js"></script>
    <script src="js/games/puzzle-games.js"></script>
    <script src="js/games/arcade-games.js"></script>
    <script src="js/games/board-games.js"></script>
    <script src="js/games/memory-games.js"></script>
    <script src="js/games/action-games.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
        document.addEventListener('DOMContentLoaded', () => App.init());
    </script>
</body>
</html>
